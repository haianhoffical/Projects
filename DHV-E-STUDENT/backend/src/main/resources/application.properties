# ============================================================
# DHV E-STUDENT - Application Configuration
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/dhv_estudent?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# JWT
app.jwt.secret=DHV_E_STUDENT_SECRET_KEY_2024_VERY_LONG_AND_SECURE_RANDOM_STRING_FOR_JWT_SIGNING
app.jwt.expiration-ms=86400000

# MoMo Sandbox
momo.partner-code=MOMO_PARTNER_CODE
momo.access-key=MOMO_ACCESS_KEY
momo.secret-key=MOMO_SECRET_KEY
momo.endpoint=https://test-payment.momo.vn/gw_payment/transactionProcessor
momo.return-url=http://localhost:8080/payment/momo-return
momo.notify-url=http://localhost:8080/payment/momo-notify

# ZaloPay Sandbox
zalopay.app-id=ZALO_APP_ID
zalopay.key1=ZALO_KEY1
zalopay.key2=ZALO_KEY2
zalopay.endpoint=https://sb-openapi.zalopay.vn/v2/create
zalopay.return-url=http://localhost:8080/payment/zalopay-return

# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dhvestudent@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.dhvestudent=DEBUG
